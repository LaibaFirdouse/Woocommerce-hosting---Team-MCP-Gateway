{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ .Values.gateway.image | quote }}
          imagePullPolicy: {{ .Values.gateway.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          env:
            - name: GATEWAY_HOST
              value: "0.0.0.0"
            - name: GATEWAY_PORT
              value: {{ .Values.gateway.port | quote }}
            - name: GATEWAY_PUBLIC_URL
              value: {{ .Values.gateway.publicUrl | quote }}
            - name: GATEWAY_CORS_ORIGINS
              value: {{ .Values.gateway.corsOrigins | quote }}
            - name: MCP_AUTH_REQUIRED
              value: {{ .Values.gateway.mcpAuthRequired | quote }}
            - name: AUTH_COOKIE_SECURE
              value: {{ .Values.gateway.authCookieSecure | quote }}
            - name: WOOCOMMERCE_MCP_URL
              value: {{ .Values.gateway.woocommerceMcpUrl | quote }}
            - name: INVENTORY_MCP_URL
              value: {{ .Values.gateway.inventoryMcpUrl | quote }}
            - name: SHIPPING_MCP_URL
              value: {{ .Values.gateway.shippingMcpUrl | quote }}
            - name: LLM_BASE_URL
              value: {{ .Values.gateway.llm.baseUrl | quote }}
            - name: LLM_MODEL
              value: {{ .Values.gateway.llm.model | quote }}
            - name: CHAT_MAX_TOOL_ROUNDS
              value: {{ .Values.gateway.chatMaxToolRounds | quote }}
            - name: CHAT_TIMEOUT_SECONDS
              value: {{ .Values.gateway.chatTimeoutSeconds | quote }}
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.secretName }}
                  key: auth-jwt-secret
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.secretName }}
                  key: llm-api-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.secretName }}
                  key: database-url
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
{{- end }}
